server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # =====================================================
    # Security Headers
    # =====================================================

    # Prevents clickjacking — blocks embedding this site in iframes from other origins
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Prevents MIME-type sniffing — forces browser to respect declared content type
    add_header X-Content-Type-Options "nosniff" always;

    # Controls referrer info sent when navigating away from the site
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Enables browser's built-in XSS protection (older browsers)
    add_header X-XSS-Protection "1; mode=block" always;

    # Controls which browser features can be used on the page
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # =====================================================
    # Gzip Compression (improves Core Web Vitals / PageSpeed)
    # =====================================================
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_vary on;

    # =====================================================
    # Static Asset Caching (improve repeat visit speed)
    # =====================================================
    location ~* \.(webp|jpg|jpeg|png|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Re-add security headers inside location block (Nginx requires this)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # =====================================================
    # SPA Fallback — serve index.html for all routes
    # =====================================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # =====================================================
    # Block access to hidden files (e.g. .git, .env)
    # =====================================================
    location ~ /\. {
        deny all;
        return 404;
    }
}
